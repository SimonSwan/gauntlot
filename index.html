<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gauntlet</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #ddd;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 32px #4af2;
    max-width: 100%; max-height: 100%;
  }
  #help {
    position: absolute; left: 8px; bottom: 8px;
    font-size: 11px; color: #888; pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="640" height="480"></canvas></div>
<div id="help">P1 WASD+G/H &nbsp; P2 IJKL+;/' &nbsp; P3 Arrows+./, &nbsp; P4 Numpad 8456+0/Enter &nbsp; F: fullscreen &nbsp; Enter: start/select</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
